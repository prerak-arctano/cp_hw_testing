board:
  name: nrf54l15_arctano
  full_name: Arctano nRF54L15
  vendor: arctano
  socs:
    - name: nrf54l15
      variants:
        - name: xip
          cpucluster: cpuflpr
runners:
  run_once:
    '--recover':
      - runners:
          - nrfjprog
          - nrfutil
        run: first
        groups:
          - boards:
              - nrf54l15_arctano/nrf54l15/cpuapp
              - nrf54l15_arctano/nrf54l15/cpuflpr
              - nrf54l15_arctano/nrf54l15/cpuflpr/xip
    '--erase':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: first
        groups:
          - boards:
              - nrf54l15_arctano/nrf54l15/cpuapp
              - nrf54l15_arctano/nrf54l15/cpuflpr
              - nrf54l15_arctano/nrf54l15/cpuflpr/xip
    '--reset':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: last
        groups:
          - boards:
              - nrf54l15_arctano/nrf54l15/cpuapp
              - nrf54l15_arctano/nrf54l15/cpuflpr
              - nrf54l15_arctano/nrf54l15/cpuflpr/xip
